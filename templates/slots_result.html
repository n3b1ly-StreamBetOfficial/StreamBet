{% extends "base.html" %}
{% block content %}
<h1>🎰 Результат</h1>
<div class="card" style="text-align:center; padding:40px;">
    <h2 style="font-size: 24px; color: #aaa;">Ставка: {{ bet }}</h2>
    
    <div style="display:flex; justify-content:center; gap: 20px; font-size: 100px; margin: 30px 0;">
        <div style="background:#000; padding:20px; border-radius:15px; border:2px solid #d4af37;">{{ result[0] }}</div>
        <div style="background:#000; padding:20px; border-radius:15px; border:2px solid #d4af37;">{{ result[1] }}</div>
        <div style="background:#000; padding:20px; border-radius:15px; border:2px solid #d4af37;">{{ result[2] }}</div>
    </div>

    {% if win > 0 %}
        <p style="color:#d4af37; font-size:60px; font-family:'Roboto Mono'; text-shadow: 0 0 30px #d4af37;">+{{ win }} 💰</p>
        <p style="color:#fff; font-size:20px;">ДЖЕКПОТ!</p>
    {% else %}
        <p style="color:#ff3b3b; font-size:50px; font-family:'Roboto Mono';">-{{ bet }} 💸</p>
        <p style="color:#aaa;">Не повезло...</p>
    {% endif %}
    
    <p style="margin-top:30px; color:#aaa;">Баланс:</p>
    <span class="balance">{{ player.balance }}</span>
    <br><br>
    <a href="{{ url_for('slots') }}"><button style="max-width:300px; margin:0 auto;">🔙 Крутить ещё</button></a>
</div>

<style>
    @keyframes pop {
        0% { transform: scale(0.5); opacity: 0; }
        70% { transform: scale(1.2); }
        100% { transform: scale(1); opacity: 1; }
    }
</style>
{% endblock %}
